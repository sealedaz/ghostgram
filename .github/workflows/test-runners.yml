name: Test Runners Matrix

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Runner Diagnostic
        run: |
          echo "OS: ${{ matrix.os }}"
          uname -a
          arch
          sw_vers || true
